<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="100%" role="img"
     aria-label="PAL speed correction: what each method restores">
<text x="40" y="28" font-family="monospace" font-size="14" fill="#1f2933">PAL 4.27% speed-up — what each correction restores</text>

<text x="40" y="66" font-family="monospace" font-size="12" fill="#1f2933">original film audio</text>
<rect x="40" y="74" width="700" height="18" fill="#2c7a5a" opacity="0.75"/>
<text x="40" y="108" font-family="monospace" font-size="11" fill="#8a94a6">duration 100%   pitch 0 cents</text>

<text x="40" y="146" font-family="monospace" font-size="12" fill="#1f2933">as broadcast (played 4.27% fast)</text>
<rect x="40" y="154" width="671" height="18" fill="#c0392b" opacity="0.75"/>
<rect x="711" y="154" width="29" height="18" fill="none" stroke="#8a94a6" stroke-dasharray="3 3"/>
<text x="40" y="188" font-family="monospace" font-size="11" fill="#c0392b">duration 95.9%   pitch +72.4 cents — audibly sharp</text>

<text x="40" y="226" font-family="monospace" font-size="12" fill="#1f2933">asetrate — resample (the inverse)</text>
<rect x="40" y="234" width="700" height="18" fill="#2c7a5a" opacity="0.75"/>
<text x="40" y="268" font-family="monospace" font-size="11" fill="#2c7a5a">duration 100%   pitch 0 cents   no added artefact</text>

<text x="460" y="226" font-family="monospace" font-size="12" fill="#1f2933">rubberband — time-stretch</text>
<rect x="460" y="234" width="0" height="0" fill="none"/>
<text x="460" y="268" font-family="monospace" font-size="11" fill="#c0392b">duration 100%   pitch STILL +72.4 cents   + stretch artefacts</text>
</svg>
