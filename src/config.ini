[mergerules]
# '=' keep two (default when values missing), '|' or for compare, '>' superior. '*' multiplicator factor to accept the rules, if absent rules don't need bitrate to compare.
audio=DTS>E-AC-3*1.1>AAC*2>MP3,DTS=Flac,Flac>AAC,Flac>E-AC-3,Flac>MP3,Flac>OPUS,AAC*1.1>AC-3,Flac>AC-3,DTS>AC-3,E-AC-3*1>AC-3,AAC*1>E-AC-3,Flac>PCM,AAC LC SBR*1.0>E-AC-3,AAC LC SBR*1.0>AC-3,AAC LC SBR*2>MP3,AAC LC SBR*1>AAC,AAC*1>AAC LC SBR,FLAC>AAC LC SBR,DTS>AAC LC SBR,E-AC-3*1.1>AAC LC SBR

[software]
mediainfo=mediainfo
ffmpeg=ffmpeg
ffprobe=ffprobe
fpcalc=fpcalc
mkvmerge=mkvmerge
audio_sync=/home/vmsam/audio_sync

[features]
# scene_anchor_protocol -- OFF by default. Gates AUTHORITY only, not
# execution: the Bidirectional Scene Anchor Protocol RUNS on every
# interior bracket and is compared against F1 regardless of this value
# (report-only, unconditional -- Lead's ruling, 2026-09-21); this flag
# decides only whether a SUCCESSFUL protocol result replaces F1's for the
# actual narrowing. REMOVAL CRITERION (Architect's ruling, 2026-09-21,
# pre-registered so this cannot linger): exits -- becomes unconditional --
# when the accumulated `chimeric: scene_anchor_shadow` census plus a
# corpus-sweep comparison have been reviewed and ruled on by the
# Architect; the Lead sequences that review. Campaign closure already
# forbids a scaffolding flag surviving it (CAMPAIGN.MD); this exit
# condition exists on top of that. Removing it is part of finishing
# (WRITE_ZONES.MD S4), not a follow-up commit.
scene_anchor_protocol=false
# scene_search_window_sec -- widened search window, EACH SIDE, around a
# coarse bracket before the anchor protocol looks for scene changes
# (ARCH_FRAME_ACCURATE.MD's Bidirectional Scene Anchor Protocol). Owner's
# default, 2026-09-21. Bounds the SEARCH only, never the size of what gets
# cut or filled once anchors are found (CAMPAIGN.MD's NON-REJECTION rule:
# no fixed size limit on the repair itself).
scene_search_window_sec=10
