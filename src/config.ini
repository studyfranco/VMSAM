[mergerules]
# '=' keep two (default when values missing), '|' or for compare, '>' superior. '*' multiplicator factor to accept the rules, if absent rules don't need bitrate to compare.
audio=DTS>E-AC-3*1.1>AAC*2>MP3,DTS=Flac,Flac>AAC,Flac>E-AC-3,Flac>MP3,Flac>OPUS,AAC*1.1>AC-3,Flac>AC-3,DTS>AC-3,E-AC-3*1>AC-3,AAC*1>E-AC-3,Flac>PCM,AAC LC SBR*1.0>E-AC-3,AAC LC SBR*1.0>AC-3,AAC LC SBR*2>MP3,AAC LC SBR*1>AAC,AAC*1>AAC LC SBR,FLAC>AAC LC SBR,DTS>AAC LC SBR,E-AC-3*1.1>AAC LC SBR

[features]
# Reparation d'un fichier refuse, au moment du refus (SPEC_ZONE_A.MD).
# FERMEES PAR DEFAUT. Pas de variable d'environnement: run.sh ne passe aucun
# --config et le Dockerfile est gele, donc un nouveau nom VMSAM_* serait absent
# au runtime et un drapeau ferme par defaut y serait ferme pour toujours.
repair_chimeric=false
repair_resample=false
# Chemin d'un fichier JSON de plans, indexe par chemin absolu du candidat. Vide:
# la mesure vient du module change_point_locator.
repair_plan_file=
# Sous-options, OUVERTES quand absentes: la capacite est deja fermee au-dessus.
repair_use_locator=true
repair_verify=true
repair_verify_tolerance_ms=100
# Aucune limite par defaut: personne n'a mesure combien de silence rend une piste
# inutilisable, et un chiffre invente ici serait indiscernable d'un chiffre mesure.
repair_max_silence_fraction=

[software]
mediainfo=mediainfo
ffmpeg=ffmpeg
ffprobe=ffprobe
fpcalc=fpcalc
mkvmerge=mkvmerge
audio_sync=/home/vmsam/audio_sync